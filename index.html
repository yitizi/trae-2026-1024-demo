<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租房大字报</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #c0392b;
  --deep-red: #8b1a1a;
  --yellow: #f5c518;
  --cream: #fdf6e3;
  --dark: #2c1810;
  --paper: #f5e6c8;
}

body {
  font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
  background: var(--cream);
  background-image: 
    repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(139, 26, 26, 0.03) 30px),
    repeating-linear-gradient(90deg, transparent, transparent 29px, rgba(139, 26, 26, 0.03) 30px);
  color: var(--dark);
  min-height: 100vh;
  padding: 0;
}

/* 顶部大标题 */
.poster-header {
  background: var(--deep-red);
  padding: 40px 20px 30px;
  text-align: center;
  position: relative;
  border-bottom: 8px solid var(--yellow);
}

.poster-header::before {
  content: '★ ★ ★ ★ ★';
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 14px;
  color: var(--yellow);
  letter-spacing: 20px;
}

.poster-header h1 {
  font-size: clamp(2.5rem, 7vw, 5rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: 0.2em;
  text-shadow: 3px 3px 0 var(--deep-red), 6px 6px 0 rgba(0,0,0,0.2);
  line-height: 1.2;
}

.poster-header .subtitle {
  font-size: clamp(1rem, 3vw, 1.5rem);
  color: var(--yellow);
  margin-top: 12px;
  letter-spacing: 0.5em;
  font-weight: 700;
}

/* 主容器 */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* 口号区 */
.slogan {
  text-align: center;
  font-size: clamp(1.4rem, 4vw, 2.2rem);
  font-weight: 900;
  color: var(--red);
  margin-bottom: 40px;
  letter-spacing: 0.1em;
  position: relative;
}

.slogan::before, .slogan::after {
  content: '❝';
  font-size: 0.8em;
  opacity: 0.5;
}

/* 表单区域 - 大字报风格 */
.form-section {
  background: var(--paper);
  border: 4px solid var(--red);
  padding: 40px 30px;
  margin-bottom: 40px;
  position: relative;
  box-shadow: 6px 6px 0 var(--red);
}

.form-section::before {
  content: '【填 表】';
  position: absolute;
  top: -20px;
  left: 30px;
  background: var(--red);
  color: #fff;
  padding: 6px 20px;
  font-size: 1.1rem;
  font-weight: 900;
  letter-spacing: 0.3em;
}

.form-group {
  margin-bottom: 30px;
}

.form-group label {
  display: block;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--red);
  margin-bottom: 12px;
  letter-spacing: 0.1em;
}

.form-group label .required {
  font-size: 0.8em;
  color: var(--yellow);
  background: var(--deep-red);
  padding: 2px 8px;
  margin-left: 8px;
  border-radius: 2px;
}

.form-group select,
.form-group input[type="number"] {
  width: 100%;
  padding: 14px 18px;
  font-size: 1.2rem;
  font-family: inherit;
  font-weight: 700;
  border: 3px solid var(--dark);
  background: var(--cream);
  color: var(--dark);
  appearance: none;
  cursor: pointer;
  transition: border-color 0.2s;
}

.form-group select:focus,
.form-group input:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.2);
}

/* 多选标签 */
.tag-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.tag-btn {
  padding: 12px 24px;
  font-size: 1.1rem;
  font-weight: 900;
  font-family: inherit;
  border: 3px solid var(--red);
  background: var(--cream);
  color: var(--red);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.05em;
}

.tag-btn.selected {
  background: var(--red);
  color: #fff;
  box-shadow: 3px 3px 0 var(--dark);
  transform: translate(2px, 2px);
}

.tag-btn:hover {
  background: rgba(192, 57, 43, 0.1);
}

.tag-btn.selected:hover {
  background: var(--deep-red);
}

/* 提交按钮 */
.submit-btn {
  display: block;
  width: 100%;
  padding: 20px;
  font-size: clamp(1.5rem, 4vw, 2rem);
  font-weight: 900;
  font-family: inherit;
  letter-spacing: 0.3em;
  background: var(--red);
  color: #fff;
  border: 4px solid var(--deep-red);
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.15s;
  box-shadow: 5px 5px 0 var(--dark);
}

.submit-btn:hover {
  background: var(--deep-red);
  transform: translate(2px, 2px);
  box-shadow: 3px 3px 0 var(--dark);
}

.submit-btn:active {
  transform: translate(5px, 5px);
  box-shadow: 0 0 0 var(--dark);
}

/* 结果区域 */
.results-section {
  display: none;
}

.results-section.active {
  display: block;
}

.result-header {
  text-align: center;
  margin-bottom: 30px;
}

.result-header h2 {
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  color: var(--red);
  letter-spacing: 0.15em;
}

.result-header .result-sub {
  font-size: 1.1rem;
  color: var(--dark);
  margin-top: 8px;
  opacity: 0.7;
}

/* 推荐卡片 - 大字报风格 */
.result-card {
  background: var(--paper);
  border: 4px solid var(--dark);
  padding: 30px;
  margin-bottom: 25px;
  position: relative;
  box-shadow: 5px 5px 0 rgba(0,0,0,0.3);
}

.result-card::before {
  content: attr(data-rank);
  position: absolute;
  top: -15px;
  right: 20px;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 900;
  background: var(--yellow);
  color: var(--deep-red);
  border: 3px solid var(--dark);
}

.result-card .card-title {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--red);
  margin-bottom: 15px;
  letter-spacing: 0.05em;
}

.result-card .card-info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 15px;
}

.info-item {
  background: var(--cream);
  border: 2px solid var(--red);
  padding: 10px 14px;
}

.info-item .info-label {
  font-size: 0.85rem;
  color: var(--dark);
  opacity: 0.6;
  margin-bottom: 4px;
}

.info-item .info-value {
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--red);
}

.result-card .card-slogan {
  margin-top: 15px;
  padding: 12px 16px;
  background: rgba(192, 57, 43, 0.08);
  border-left: 4px solid var(--red);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1.6;
}

/* 底部口号 */
.footer-slogan {
  text-align: center;
  padding: 30px 20px 50px;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  font-weight: 900;
  color: var(--red);
  letter-spacing: 0.2em;
  border-top: 4px solid var(--red);
  margin-top: 50px;
  position: relative;
}

.footer-slogan::after {
  content: '★';
  display: block;
  font-size: 1.5rem;
  margin-top: 10px;
  color: var(--yellow);
}

/* 动画 */
@keyframes stampIn {
  0% { transform: scale(2) rotate(-5deg); opacity: 0; }
  60% { transform: scale(0.9) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.result-card {
  animation: stampIn 0.4s ease-out forwards;
}

.result-card:nth-child(2) { animation-delay: 0.1s; }
.result-card:nth-child(3) { animation-delay: 0.2s; }

/* 响应式 */
@media (max-width: 600px) {
  .form-section { padding: 30px 20px; }
  .result-card { padding: 20px; }
  .result-card .card-info { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<header class="poster-header">
  <h1>租 房 大 字 报</h1>
  <div class="subtitle">—— 找 房 不 迷 路 · 住 房 不 受 气 ——</div>
</header>

        <option value="shanghai">上海（魔都）</option>
      </select>
    </div>

    <div class="form-group">
      <label>预算范围 <span class="required">必填</span></label>
      <select id="budget" required>
        <option value="">—— 请选择（别谦虚）——</option>
        <option value="1500">1500 元/月 以下（自力更生）</option>
        <option value="3000">1500 ~ 3000 元/月（艰苦奋斗）</option>
        <option value="5000">3000 ~ 5000 元/月（安居乐业）</option>
        <option value="8000">5000 ~ 8000 元/月（中产奋斗）</option>
        <option value="12000">8000 ~ 12000 元/月（阔气生活）</option>
        <option value="20000">12000 元以上（大富大贵）</option>
      </select>
    </div>

    <div class="form-group">
      <label>居住需求 <span class="required">必填</span></label>
      <div class="tag-group" id="typeTags">
        <button class="tag-btn" data-value="studio">单间</button>
        <button class="tag-btn" data-value="1b1l">一室一厅</button>
        <button class="tag-btn" data-value="2b1l">两室一厅</button>
        <button class="tag-btn" data-value="3b2l">三室两厅</button>
        <button class="tag-btn" data-value="apt">公寓</button>
      </div>
    </div>

    <div class="form-group">
      <label>通勤区域</label>
      <select id="district">
        <option value="">—— 不限区域（四海为家）——</option>
        <option value="city_center">市中心（黄金地段）</option>
        <option value="metro">地铁口（脚踩两城）</option>
        <option value="suburb">近郊（宁静致远）</option>
        <option value="university">大学城（书香气）</option>
        <option value="business">商务区（卷王聚集）</option>
      </select>
    </div>

    <div class="form-group">
      <label>特殊要求（可多选）</label>
      <div class="tag-group" id="extraTags">
        <button class="tag-btn" data-value="pet">可养宠</button>
        <button class="tag-btn" data-value="balcony">有阳台</button>
        <button class="tag-btn" data-value="furnished">拎包入住</button>
        <button class="tag-btn" data-value="parking">有车位</button>
        <button class="tag-btn" data-value="elevator">电梯房</button>
        <button class="tag-btn" data-value="near_subway">地铁5分钟</button>
      </div>
    </div>

    <div class="form-group">
      <label>入住时间</label>
      <input type="number" id="moveDate" min="0" max="6" placeholder="0" 
             style="width: 200px; display: inline-block;" title="X 个月内入住">
      <span style="font-weight: 900; color: var(--red); margin-left: 8px;">个月内必须搬进去</span>
    </div>

    <button class="submit-btn" id="submitBtn">查 房 ！</button>
  </section>

  <!-- 结果 -->
  <section class="results-section" id="results">
    <div class="result-header">
      <h2 id="resultTitle">—— 查询结果 ——</h2>
      <div class="result-sub" id="resultSub"></div>
    </div>
    <div id="resultCards"></div>
  </section>
</div>

<footer class="footer-slogan">
  房子是租来的，生活不是！
</footer>

  // 筛选：城市 → 预算 → 户型 → 区域
  let results = HOUSES.filter(h => {
    if (h.city !== city) return false;
    if (h.budget > budget) return false;
    if (types.length > 0 && !types.includes(h.type)) return false;
    if (district && h.district !== district) return false;
    return true;
  });

  // 额外需求过滤（软过滤，不满足也展示但降权）
  results.sort((a, b) => {
    const aScore = extras.filter(e => a.extras.includes(e)).length;
    const bScore = extras.filter(e => b.extras.includes(e)).length;
    if (bScore !== aScore) return bScore - aScore;
    return a.budget - b.budget;
  });

  // 取前 5 条
  results = results.slice(0, 5);

  const resultsSection = document.getElementById('results');
  const cardsDiv = document.getElementById('resultCards');
  const subDiv = document.getElementById('resultSub');

  // 构建摘要
  const typeStr = types.map(t => TYPE_LABELS[t]).join('、');
  const districtStr = district ? DISTRICT_LABELS[district] : '不限';
  const budgetStr = budget >= 10000 ? `${budget/10000}万` : `${budget}元/月`;
  subDiv.textContent = `${CITY_LABELS[city]} · 预算 ${budgetStr} · ${typeStr} · ${districtStr} · ${extras.length} 项要求`;

  if (results.length === 0) {
    // 给出该条件下最低参考价，告诉用户差多少（先查同区域，查不到就放宽到全市）
    let fallback = HOUSES.filter(h => h.city === city && types.includes(h.type) && (!district || h.district === district));
    if (fallback.length === 0) fallback = HOUSES.filter(h => h.city === city && types.includes(h.type));
    let hintHtml = '<div style="opacity: 0.7; margin-top: 10px; font-size: 1.1rem;">适当降低要求，好房子不挑人——但人得挑好房子。</div>';
    if (fallback.length > 0) {
      const minPrice = Math.min(...fallback.map(h => h.budget));
      hintHtml = `<div style="opacity: 0.7; margin-top: 10px; font-size: 1.1rem;">${CITY_LABELS[city]}这个区域${typeStr}最低月租 <b style="color: var(--red);">¥${minPrice.toLocaleString()}</b>，预算加到这个数就有房！</div>`;
    }
    document.getElementById('resultTitle').textContent = `—— ${CITY_LABELS[city]} · 查无此房 ——`;
    cardsDiv.innerHTML = `
      <div class="result-card" style="border-color: var(--dark); text-align: center; padding: 50px 30px;">
        <div style="font-size: 3rem; margin-bottom: 20px;">📭</div>
        <div class="card-title" style="font-size: 1.5rem;">条件太苛刻了同志！</div>
        ${hintHtml}
      </div>`;
  } else {
    document.getElementById('resultTitle').textContent = `—— ${CITY_LABELS[city]} · 查到 ${results.length} 套好房 ——`;
    cardsDiv.innerHTML = results.map((h, i) => {
      const matchedExtras = h.extras.filter(e => extras.includes(e));
      const extraText = matchedExtras.length > 0 
        ? matchedExtras.map(e => EXTRA_LABELS[e]).join(' · ')
        : h.extras.map(e => EXTRA_LABELS[e]).join(' · ');
      
      return `
        <div class="result-card" data-rank="${i + 1}">
          <div class="card-title">${h.name}</div>
          <div class="card-info">
            <div class="info-item">
              <div class="info-label">户型</div>
              <div class="info-value">${TYPE_LABELS[h.type]}</div>
            </div>
            <div class="info-item">
              <div class="info-label">面积</div>
              <div class="info-value">${h.size}</div>
            </div>
            <div class="info-item">
              <div class="info-label">月租</div>
              <div class="info-value">¥${h.budget.toLocaleString()}</div>
            </div>
            <div class="info-item">
              <div class="info-label">楼层</div>
              <div class="info-value">${h.floor}</div>
            </div>
          </div>
          <div style="margin-bottom: 10px; font-size: 0.95rem; font-weight: 700; color: var(--dark); opacity: 0.8;">
            ✦ ${DISTRICT_LABELS[h.district]} · ${extraText}
          </div>
          <div class="card-slogan">${h.slogan}</div>
        </div>`;
    }).join('');
  }

  resultsSection.classList.add('active');
  resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
</script>

</body>
</html>
